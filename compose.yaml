services:
  app:
    build: .
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://climavivo:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/clima
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clima
      POSTGRES_USER: climavivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - clima_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climavivo -d clima"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  clima_data:
